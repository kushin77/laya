name: CI

# Path-scoped test/lint gate for the engine and UI modules. Neither module had
# any workflow that ran on ordinary source edits before this — engine-deps.yml
# only covers dependency-pin changes, release.yml only builds. See fork
# issues #37 (no test/typecheck CI), #42 (no lint gate), #43 (no path-scoped
# triggers).

on:
  pull_request:
    paths:
      - 'engine/laya/**'
      - 'engine/tests/**'
      - 'engine/requirements*'
      - 'ui/src/**'
      - 'ui/package.json'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'engine/laya/**'
      - 'engine/tests/**'
      - 'engine/requirements*'
      - 'ui/src/**'
      - 'ui/package.json'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  # Per-module gate: a PR that only touches ui/** shouldn't pay for the
  # engine jobs and vice versa (fork issue #40 — pages.yml already does
  # this per-workflow with landing/**; ci.yml covers two modules in one
  # workflow, so the split happens per job instead).
  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            engine:
              - 'engine/laya/**'
              - 'engine/tests/**'
              - 'engine/requirements*'
              - '.github/workflows/ci.yml'
            ui:
              - 'ui/src/**'
              - 'ui/package.json'
              - '.github/workflows/ci.yml'

  engine-test:
    name: Engine — lint + pytest
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Install engine deps
        working-directory: engine
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt
      - name: Test (pytest)
        working-directory: engine
        run: pytest -q

  engine-lint:
    name: Engine — lint (ruff, non-blocking bootstrap)
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install "ruff>=0.16"
      # ruff is pinned in requirements-dev now (matching this floor), but the
      # codebase has never been linted, so this stays informational (see
      # fork issue #42) until a baseline is established.
      - name: Lint (ruff)
        working-directory: engine
        run: ruff check laya
        continue-on-error: true

  ui-test:
    name: UI — lint + typecheck + vitest
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: ui
        run: npm ci
      # eslint was only just bootstrapped for this project (see fork issue #27)
      # and the codebase has never been linted, so this starts informational —
      # tighten to blocking once a baseline is established.
      - name: Lint (eslint)
        working-directory: ui
        run: npm run lint
        continue-on-error: true
      - name: Typecheck (svelte-check)
        working-directory: ui
        run: npm run check
      - name: Unit tests (vitest)
        working-directory: ui
        run: npm test
